name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: codeberg-small
    container:
      image: danieltrick/rust-tss2-docker
    steps:
      - name: Install Node
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends nodejs

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: Perform Code Check
        run: make check
